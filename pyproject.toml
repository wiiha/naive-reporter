[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "naive-reporter"
version = "0.1.0"
description = "PDF ingestion and chat pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "bm25s>=0.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "black>=24",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
naive-reporter = "naive_reporter.cli:main"
naive-reporter-search = "naive_reporter.search_cli:main"
naive-reporter-report = "naive_reporter.report_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py310"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
strict = true
